name: Training report (legacy, workout-only PDF)

# Superseded by unified_report.yml, which emails one merged training+nutrition
# dashboard instead of this workout-only PDF — kept manual-only (no more
# auto-fire on push) so the two don't both email on the same day. Left in
# place, not deleted, in case the unified rollout needs a rollback.
on:
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need HEAD~1 to check whether WORKOUTS actually changed

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"   # don't pull all browsers here

      # data.js also carries sleep/bodyweight logs, which should build quietly
      # in the background — only a new WORKOUTS session should trigger the email.
      - name: Check for a new workout
        id: check_workout
        run: node report/check_new_workout.mjs
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Install Chromium
        if: steps.check_workout.outputs.new_workout == 'true'
        run: npx playwright install --with-deps chromium

      - name: Render dashboard to PDF
        if: steps.check_workout.outputs.new_workout == 'true'
        run: npm run render

      - name: Upload PDF artifact
        if: steps.check_workout.outputs.new_workout == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: training-report
          path: report.pdf
          if-no-files-found: error

      - name: Email the report
        if: steps.check_workout.outputs.new_workout == 'true'
        env:
          # Preferred: Resend API key (any of these secret names).
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || secrets.RESEND || secrets.RESEND_KEY }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
          # Fallback: Gmail SMTP (accepts several common secret names).
          SMTP_USER: ${{ secrets.SMTP_USER || vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.GMAIL || secrets.SMTP_PASS || secrets.SMTP_PASSWORD || secrets.GMAIL_APP_PASSWORD || secrets.GMAIL_PASSWORD || secrets.EMAIL_PASSWORD || secrets.APP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO || vars.REPORT_TO }}
        run: npm run send

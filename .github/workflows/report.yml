name: Training report

# Runs after each "log": whenever data.js changes on these branches.
on:
  push:
    branches: [main, "claude/epic-bardeen-4l8r4c"]
    paths: ["data.js"]
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"   # don't pull all browsers here

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Render dashboard to PDF
        run: npm run render

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: training-report
          path: report.pdf
          if-no-files-found: error

      - name: Email the report
        env:
          # Accept the most common names so whichever you created is picked up.
          SMTP_USER: ${{ secrets.SMTP_USER || vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.SMTP_PASSWORD || secrets.GMAIL_APP_PASSWORD || secrets.GMAIL_PASSWORD || secrets.EMAIL_PASSWORD || secrets.APP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO || vars.REPORT_TO }}
        run: npm run send

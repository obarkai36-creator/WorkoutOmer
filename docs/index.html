<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkoutOmer Dashboard</title>
<link rel="stylesheet" href="style.css">
<script src="vendor/chart.umd.js"></script>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <div class="mark"></div>
      <div>
        <h1>WorkoutOmer</h1>
        <div class="subtitle" id="subtitle">Loading…</div>
      </div>
    </div>
    <div class="datenav">
      <button id="prevDay" title="Previous day">‹</button>
      <input type="date" id="datePick">
      <button id="nextDay" title="Next day">›</button>
      <button class="today-btn" id="jumpLatest">Latest</button>
    </div>
  </header>

  <div id="content">
    <div class="loading">Loading day data…</div>
  </div>

  <div class="footer" id="footer"></div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-panel">
    <div class="modal-head">
      <div class="title"><div id="modalRing"></div><div><h2 id="modalTitle">—</h2><div class="subtitle" id="modalSubtitle">—</div></div></div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
